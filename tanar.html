.chev.r-u{border-color:#ff6b6b;box-shadow:0 0 40px #ff6b6b66}.chev.r-u .rar{color:#ffb0b0}
@keyframes chpop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}

const CLS_NAME={harcos:'Harcos',magus:'Mágus',gyogyito:'Gyógyító'};
const PET_N={sarkany:'Sárkányfióka',bagoly:'Bagoly',fonix:'Főnix',roka:'Rókakölyök'};
const petStageN=f=>f>=25?'legendás':f>=10?'felnőtt':'kölyök';
const petList=s=>Array.isArray(s.pets)?s.pets:[];
const petsHTML=s=>petList(s).length?petList(s).map(p=>`<span class="pill${p.id===s.pet_on?' g':''}" title="${p.id===s.pet_on?'Ez kíséri most':''}">🐾 <b>${esc(p.name)}</b> · ${PET_N[p.sp]||esc(p.sp)} · ${petStageN(p.feed||0)} (${p.feed||0} etetés)${p.gift?' · ajándék':''}</span>`).join(' '):'<span class="muted small">Még nincs társa.</span>';

const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const pct=(a,b)=>b?Math.round(a/b*100):0;
const stars=m=>m?'★'.repeat(m)+'☆'.repeat(3-m):'–';
function toast(t){const e=$('toast');e.textContent=t;e.className='toast show';clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='toast',2600)}

/* ---------- Supabase REST ---------- */
let SESS=null;try{SESS=JSON.parse(localStorage.getItem('mk-teacher')||'null')}catch(e){}
const base=()=>SB.url.replace(/\/+$/,'');
async function authCall(grant,body){
  const r=await fetch(base()+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:SB.key,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error_description||d.msg||d.message||'Hibás belépés');
  SESS={access:d.access_token,refresh:d.refresh_token,exp:Date.now()+(d.expires_in||3600)*1000-60000,uid:d.user&&d.user.id,email:d.user&&d.user.email};
  localStorage.setItem('mk-teacher',JSON.stringify(SESS));return SESS;
}
async function api(path,{method='GET',body,prefer}={},retry=true){
  if(SESS&&Date.now()>SESS.exp){try{await authCall('refresh_token',{refresh_token:SESS.refresh})}catch(e){logout();throw e}}
  const h={apikey:SB.key,'Content-Type':'application/json',Authorization:'Bearer '+SESS.access};if(prefer)h.Prefer=prefer;
  const r=await fetch(base()+'/rest/v1/'+path,{method,headers:h,body:body?JSON.stringify(body):undefined});
  if(r.status===401&&retry){try{await authCall('refresh_token',{refresh_token:SESS.refresh});return api(path,{method,body,prefer},false)}catch(e){logout();throw e}}
  const txt=await r.text();const d=txt?JSON.parse(txt):null;
  if(!r.ok)throw new Error((d&&d.message)||('HTTP '+r.status));return d;
}
const rpc=(fn,args)=>api('rpc/'+fn,{method:'POST',body:args||{}});
function logout(){localStorage.removeItem('mk-teacher');SESS=null;location.reload()}

/* ---------- állapot ---------- */
const V={tab:'overview',classes:[],cls:null,period:30,stats:null,sort:'nick',sortDir:1,errTopic:'',student:null,detail:null,newPins:null,privDraft:null};
const curClass=()=>V.classes.find(c=>c.id===V.cls);
const since=()=>new Date(Date.now()-V.period*864e5).toISOString();
async function loadClasses(){V.classes=await api('classes?select=id,name,config,created_at&order=created_at');if(!V.classes.find(c=>c.id===V.cls))V.cls=(V.classes[0]||{}).id||null;localStorage.setItem('mk-t-cls',V.cls||'')}
async function loadStats(){V.stats=V.cls?await rpc('teacher_class_stats',{p_class:V.cls,p_since:since()}):null;
  /* all: minden fiók (Kezelés, Tanulói részletek); students: csak akik beszámítanak a kimutatásokba (teszt-/vendégfiók nélkül) */
  if(V.stats){V.stats.all=V.stats.students;V.stats.students=V.stats.all.filter(s=>s.in_stats!==false)}
  await loadFeedback()}
async function loadFeedback(){V.fb=null;if(!V.cls)return;const q=x=>api('feedback?class_id=eq.'+V.cls+'&select=id,nick,kind,body,app_version,screen,device,status,created_at'+x+'&order=created_at.desc&limit=500');
  try{V.fb=await q(',read_at,reward_gold,reward_xp,note,notified_at,student_seen_at');V.fbV16=true}   // v1.6 oszlopok
  catch(e){V.fbV16=false;try{V.fb=await q('')}catch(e2){V.fb=null;V.fbErr=e2.message}}}
async function refresh(){try{await loadStats()}catch(e){toast('Hiba: '+e.message)}await loadPolls();render()}

/* ---------- belépés ---------- */
function loginView(msg){
  $('app').innerHTML=`<form class="loginwrap" id="lf"><h2>Matek-kaland · tanári felület</h2>
   ${SB.url?'':'<p class="err">Hiányzik a Supabase-beállítás (SB.url, SB.key) a tanar.html elején.</p>'}
   <label>E-mail<input id="le" type="email" autocomplete="username" required></label>
   <label>Jelszó<input id="lp" type="password" autocomplete="current-password" required></label>
   <p class="err" id="lerr">${msg||''}</p><button class="btn" style="width:100%;padding:11px">Belépés</button>
   <p class="small muted">A fiókot a Supabase-ben, az Authentication → Users menüben hozod létre.</p></form>`;
  $('lf').onsubmit=async e=>{e.preventDefault();$('lerr').textContent='';
    try{await authCall('password',{email:$('le').value,password:$('lp').value});await rpc('teacher_hello',{p_name:''});boot()}
    catch(x){$('lerr').textContent=/Invalid login/i.test(x.message)?'Hibás e-mail vagy jelszó.':x.message}};
}
async function boot(){
  if(!SESS)return loginView();
  V.cls=localStorage.getItem('mk-t-cls')||null;
  try{await rpc('teacher_hello',{p_name:''});await loadClasses();await loadStats()}catch(e){return loginView('A belépés lejárt, lépj be újra.')}
  if(!V.classes.length)V.tab='manage';
  render();
}

/* ---------- keret ---------- */
function render(){

  const S=st.students,N=S.length,act=S.filter(s=>s.n>0).length,tot=S.reduce((a,s)=>a+s.n,0),ok=S.reduce((a,s)=>a+s.ok,0);

    <div class="kpi"><b>${st.coupons.length}</b><span>beváltásra váró kupon</span></div></div>
   ${N?`<div class="tw"><table id="ovt"><thead><tr>${cols.map(([k,n])=>`<th data-sort="${k}">${n}${V.sort===k?(V.sortDir>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>
   ${rows.map(s=>`<tr class="click ${s.n?'':'idle'}" data-stu="${s.id}"><td><b>${esc(s.nick)}</b>${s.active?'':' <span class="pill r">letiltva</span>'}${s.locked?' <span class="pill y">zárolva</span>':''}</td>
     <td>${ago(s.last_seen)}</td><td>${s.days}</td><td>${s.n}</td>
     <td>${s.n?`<div style="display:flex;gap:6px;align-items:center"><div class="bar ok" style="width:60px"><i style="width:${pct(s.ok,s.n)}%"></i></div>${pct(s.ok,s.n)}%</div>`:'–'}</td>
     <td class="stars">${stars(topicMax(s,'betus'))}</td><td class="stars">${stars(topicMax(s,'zk'))}</td>
     <td>${s.clvl?`${s.clvl}. szint${s.cls?' · '+(CLS_NAME[s.cls]||''):''}`:'–'}${petList(s).length?` <span class="small" title="${petList(s).map(p=>esc(p.name)).join(', ')}">🐾${petList(s).length}</span>`:''}</td>
     <td>${s.grades.map(g=>gChip(g,s)).join('')||'–'}</td></tr>`).join('')}
   </tbody></table></div>
   <p class="small muted">A csillagok a témában elért legmagasabb fokozatot mutatják (★ alap · ★★ közepes · ★★★ haladó). A szürke sorok az időszakban nem gyakoroltak. Kattints egy diákra a részletekért, egy jegyre a próba naplójáért. A ⚠ jelű jegyeket érdemes átnézni (az okot a jegy fölé állva látod). Az áthúzott jegy nem számít: <b>ismétlés</b> (ugyanabból az altémából már megvolt) vagy <b>javítva</b> (a 4-es után megszerezte az 5-öst).</p>`
   :`<p>Még nincs diák ebben az osztályban. A <b>Kezelés</b> fülön tudsz felvenni.</p>`}`;

function errorsHTML(){
  const st=V.stats;if(!st)return '';
  const f=x=>!V.errTopic||x.topic===V.errTopic;
  const errs=st.errors.filter(f),N=st.students.length;
  const agg={};errs.forEach(e=>{const k=e.err;agg[k]=agg[k]||{err:k,n:0,topics:new Set()};agg[k].n+=e.n;agg[k].topics.add(e.topic)});
  const stuBy={};st.matrix.filter(f).forEach(m=>{(stuBy[m.err]=stuBy[m.err]||new Set()).add(m.student_id)});
  const list=Object.values(agg).sort((a,b)=>b.n-a.n),mx=list.length?list[0].n:1;
  const top=list.slice(0,8).map(x=>x.err);
  const cell={};st.matrix.filter(f).forEach(m=>{cell[m.student_id+'|'+m.err]=(cell[m.student_id+'|'+m.err]||0)+m.n});
  const heat=n=>!n?'':`background:rgba(192,57,43,${Math.min(.85,.15+n*.12)});color:${n>4?'#fff':'#5a1a12'}`;
  const lv=st.levels.filter(f);
  return `<h2>Hibatérkép</h2>
   <div class="chips">${[['','Minden téma'],...Object.entries(TOPICS)].map(([k,n])=>`<button class="chip ${V.errTopic===k?'on':''}" data-et="${k}">${n}</button>`).join('')}</div>
   ${list.length?`<div class="box"><b>Órán érdemes gyakoroltatni:</b> ${list.slice(0,3).map(x=>`<b>${esc(x.err)}</b> (${(stuBy[x.err]||new Set()).size} diáknál)`).join(' · ')}</div>
   <h3>Leggyakoribb hibák</h3>
   ${list.map(x=>`<div class="errrow"><div><b>${esc(x.err)}</b><div class="small muted">${[...x.topics].map(t=>TOPICS[t]||t).join(', ')}</div></div>
     <div class="bar"><i style="width:${x.n/mx*100}%"></i></div><div class="small">${x.n}× · ${(stuBy[x.err]||new Set()).size}/${N} diák</div></div>`).join('')}
   <h3>Ki mivel küzd?</h3><div class="tw"><table class="heat"><thead><tr><th>Diák</th>${top.map(t=>`<th>${esc(t)}</th>`).join('')}</tr></thead><tbody>
   ${st.students.filter(s=>top.some(t=>cell[s.id+'|'+t])).map(s=>`<tr class="click" data-stu="${s.id}"><td>${esc(s.nick)}</td>${top.map(t=>{const n=cell[s.id+'|'+t]||0;return `<td style="${heat(n)}">${n||''}</td>`}).join('')}</tr>`).join('')}
   </tbody></table></div>`:'<p class="muted">Ebben az időszakban nincs rögzített hiba. 🎉</p>'}
   ${lv.length?`<h3>Fokozatonként (gyakorlás)</h3><table><thead><tr><th>Téma</th><th>Fokozat</th><th>Feladat</th><th>Helyes</th><th></th></tr></thead><tbody>
   ${lv.map(l=>`<tr><td>${TOPICS[l.topic]||l.topic}</td><td class="stars">${stars(l.level)}</td><td>${l.n}</td><td>${pct(l.ok,l.n)}%</td><td style="width:40%"><div class="bar ok"><i style="width:${pct(l.ok,l.n)}%"></i></div></td></tr>`).join('')}</tbody></table>`:''}
   <p class="small muted">A hibát akkor számoljuk, ha a válasz rossz vagy csak részben jó volt. A hibatípust a játék ismeri fel a válaszból.</p>`;
}

/* ---------- Gyanús jegyek ---------- */
const BOSS_HP={t4:120,t5:200};          // a v1.7 előtti próbák életereje; azóta a szerver a próbánál tárolja (t4: 140, t5: 280)
/* v1.7: altémánként egy jegy. ismétlés = ugyanabból az altémából már volt ilyen vagy jobb; javítva = a 4-es után megvan az 5-ös */
const gStatus=(g,all)=>g.repeat?'repeat':(+g.grade===4&&(all||[]).some(x=>!x.repeat&&x.topic===g.topic&&+x.grade===5))?'javitva':'ok';
const effGrades=s=>(s.grades||[]).filter(g=>gStatus(g,s.grades)==='ok');
const gChip=(g,s)=>{const st=gStatus(g,s.grades),fl=st==='ok'?gradeFlags(g):[];
  return `<span class="grade gclick${fl.length?' sus':''}${st!=='ok'?' gx':''}" data-trial="${g.id}" data-gstu="${s.id}" title="${esc(TOPICS[g.topic]||g.topic)} · ${fmtDT(g.at)}${st==='repeat'?' · ismétlés – nem számít':st==='javitva'?' · javítva 5-re':''}${fl.length?' · ⚠ '+esc(fl.join('; ')):''} – kattints a naplóért">${g.grade}${fl.length?'⚠':''}</span>`};
const TRIAL_ALL=()=>LESSONS.filter(l=>l.ready).map(l=>l.key);
const trialTopicsT=c=>Array.isArray(c&&c.config&&c.config.trial_topics)?c.config.trial_topics:TRIAL_ALL();
function gradeFlags(g){
  if(g.log_n===undefined)return [];       // régi SQL: nincs adat, nincs jelzés
  const f=[];
  if(!g.log_n){f.push('nincs napló');return f}
  const need=g.hp||BOSS_HP[g.boss]||0;if(g.log_dmg<need)f.push(`a napló szerint csak ${g.log_dmg} sebzés (kellett: ${need})`);
  const sec=(new Date(g.at)-new Date(g.started))/1000;if(sec>0&&sec/g.log_n<4)f.push(`túl gyors: ${Math.round(sec)} mp alatt ${g.log_n} válasz`);
  if(g.ev_n!==g.log_n)f.push(`a feladatnaplóban ${g.ev_n} próbaválasz van, a próbanaplóban ${g.log_n}`);
  return f;
}

/* ---------- Tanulói részletek ---------- */
async function openStudent(id){
  V.student=id;V.detail={loading:true};render();
  try{
    const [ev,tr]=await Promise.all([api(`events?student_id=eq.${id}&ts=gte.${encodeURIComponent(since())}&order=ts.desc&limit=1000`),
      api(`trials?student_id=eq.${id}&order=started_at.desc&limit=60`)]);
    V.detail={ev,tr};
    try{V.detail.msgs=await api(`messages?student_id=eq.${id}&order=created_at.desc&limit=30`)}catch(e){V.detail.msgs=null}   // v1.7.1 (ha még nem futott az SQL: null)
  }catch(e){V.detail={err:e.message}}
  if(V.tab==='student')render();
  if(V.openTrial)setTimeout(()=>{const r=document.getElementById('tr-'+V.openTrial);if(r)r.scrollIntoView({behavior:'smooth',block:'center'})},60);
}

  const ev=d.ev||[],n=ev.length,ok=ev.filter(e=>e.status==='correct').length;

   <h3>Társai</h3><p style="display:flex;gap:6px;flex-wrap:wrap;margin:0">${petsHTML(s)}</p>${msgHTML(s,d)}

     <div class="dlbl"><span>${arr[0].dt.toLocaleDateString('hu-HU',{month:'short',day:'numeric'})}</span><span>ma</span></div><p class="small muted">Zöld: jó válasz, piros: rossz vagy részben jó.</p></div>
    <div><h3>Hibái</h3>${el.length?el.map(([k,v])=>`<div class="errrow" style="grid-template-columns:1fr 1fr 40px"><b class="small">${esc(k)}</b><div class="bar"><i style="width:${v/el[0][1]*100}%"></i></div><span class="small">${v}×</span></div>`).join(''):'<p class="muted small">Nincs hibája az időszakban.</p>'}</div></div>

/* ---------- v1.7.1: Levél a Mestertől + Új nevet kér a társ ---------- */

  if(d.msgs===null)return `<p class="small muted" style="margin-top:10px">A levelekhez futtasd le a <code>supabase/v1.7.1-mester-levele.sql</code>-t.</p>`;

                                   :(m.seen_at?`<span class="pill g">elolvasta ${fmtDT(m.seen_at)}</span>`:'<span class="pill y">még nem lépett be azóta</span>');
  return `<div class="grid2" style="margin-top:10px"><div><h3>📜 Levél a Mestertől</h3>

function pollShow(id){const p=(V.polls||[]).find(x=>x.id===id);if(!p)return;
  const stu=(V.stats&&V.stats.all)||[],inS=sid=>{const s=stu.find(x=>x.id===sid);return !s||s.in_stats!==false};
  const votes=(V.pollVotes||[]).filter(v=>v.poll_id===id&&inS(v.student_id)),cnt=oid=>votes.filter(v=>v.option_id===oid).length;
  const ok=(V.pollOpts||[]).filter(o=>o.poll_id===id&&o.status==='ok').sort((a,b)=>cnt(b.id)-cnt(a.id)),mx=Math.max(1,...ok.map(o=>cnt(o.id)));

   <p style="text-align:center"><button class="btn" id="pollShowClose">Bezár</button></p></div>`;

document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-pphase],[data-popt],[data-pdelpoll],[data-pshow],#pPreset,#pollShowClose');if(!t)return;
  try{
    if(t.id==='pollShowClose'){$('pollShow').remove();return}
    if(t.id==='pPreset'){V.pollForm={title:NAME_POLL.title,question:NAME_POLL.question,opts:NAME_POLL.opts.join('\n'),votes:2,prop:true};render();return}
    if(t.dataset.pshow){pollShow(t.dataset.pshow);return}
    if(t.dataset.pphase){const [id,ph]=t.dataset.pphase.split(':');if(ph==='lezart'&&!confirm('Lezárod a szavazást? Utána a diákok látják az eredményt.'))return;
      await api(`polls?id=eq.${id}`,{method:'PATCH',body:{phase:ph,closed_at:ph==='lezart'?new Date().toISOString():null}});await loadPolls();render();toast('Mentve: '+PH[ph]);return}
    if(t.dataset.popt){const [id,st]=t.dataset.popt.split(':');
      if(st==='del'){if(!confirm('Törlöd ezt a lehetőséget? A rá leadott szavazatok is elvesznek.'))return;await api(`poll_options?id=eq.${id}`,{method:'DELETE'})}
      else await api(`poll_options?id=eq.${id}`,{method:'PATCH',body:{status:st}});
      await loadPolls();render();return}
    if(t.dataset.pdelpoll){if(!confirm('Törlöd a szavazást az összes javaslattal és szavazattal együtt?'))return;await api(`polls?id=eq.${t.dataset.pdelpoll}`,{method:'DELETE'});await loadPolls();render();toast('Törölve');return}
  }catch(x){toast('Hiba: '+x.message)}
});
document.addEventListener('submit',async e=>{

async function chDraw(){

    st.opener_nick=null;chestRender();setTimeout(chDraw,50)}
  else if(a==='open')chOpenBox();
  else if(a==='swap'){const id=$('chSwap').value,h=mkHoliday(CH.st.day);try{CH.st=await rpc('teacher_day_open',{p_class:V.cls,p_ev:id,p_ev2:h?h.id:null,p_how:CH.st.how==='class'?'class':'teacher'});chestRender();toast('Esemény cserélve – a diákoknál pár percen belül frissül')}catch(x){toast('Hiba: '+x.message)}}
  else if(a==='reset'){if(!confirm('Visszazárod a mai ládát? A sorsolás is újraindul.'))return;try{CH.st=await rpc('teacher_day_reset',{p_class:V.cls});CH.exclude=[];chestRender()}catch(x){toast('Hiba: '+x.message)}}
});


/* ---------- v1.6 KÖNYVTÁR: fogalomnyitás, pecsétek, a 45 fogalom címe ---------- */
const libReadyT=()=>typeof LIB_CONCEPTS!=='undefined';
function libCfg(){const c=curClass()||{};return (c.config&&c.config.concepts)||{}}
function libTitlesT(){const c=curClass()||{},t=c.config&&Array.isArray(c.config.concept_titles)?c.config.concept_titles:[];
  return Array.from({length:LIB_EXAM_N},(_,i)=>t[i]||LIB_DEFAULT_TITLES[i+1]||'')}
function libraryHTML(){
  if(!libReadyT())return '<h2>Könyvtár</h2><p class="err">A konyvtar.js nem töltődött be. Töltsd fel a GitHubra is!</p>';
  const c=curClass();if(!c)return '<h2>Könyvtár</h2><p>Először hozz létre egy osztályt.</p>';
  const cfg=libCfg(),isl=LIB_CONCEPTS,st=V.stats,S=st?st.students:[];
  const code=x=>x.n?x.n+'.':x.id;
  const libOf=s=>(s.lib&&typeof s.lib==='object')?s.lib:{};
  const sealN=x=>S.filter(s=>libOf(s)[x.id]&&libOf(s)[x.id].seal).length;
  const libErr=(st&&st.errors||[]).filter(e=>e.topic==='lib').sort((a,b)=>b.n-a.n).slice(0,10);
  return `<h2>Bölcsességek Könyvtára</h2>
   <p class="small muted">A diák a fogalom lapját és kártyáit tanulja, aztán A Könyvtáros kikérdezi: 6 kérdésből legalább 5 jó kell a pecséthez (+${LIB_SEAL_XP} XP, +${LIB_SEAL_GOLD} arany, fogalmanként egyszer). A fogalom csak akkor jelenik meg nyitottként, ha itt megnyitod.</p>
   <div class="grid2"><div>
    <h3>Fogalmak nyitása</h3>
    <table>${isl.map(x=>{const on=cfg[x.id]==='open';return `<tr><td><b>${code(x)}</b> ${esc(x.title)}</td><td class="small">${sealN(x)} pecsét</td>
      <td style="white-space:nowrap"><button class="chip ${on?'on':''}" data-concept="${x.id}:open">Nyitva</button> <button class="chip ${on?'':'on'}" data-concept="${x.id}:closed">Zárva</button></td></tr>`}).join('')}</table>
    <p><button class="btn sm ghost" data-concept="*:open">Mind nyitva</button> <button class="btn sm ghost" data-concept="*:closed">Mind zárva</button></p>
   </div><div>
    <h3>Ahol a legtöbben hibáznak</h3>
    ${libErr.length?`<table>${libErr.map(e=>`<tr><td>${esc(e.err.replace(/^Könyvtár /,''))}</td><td class="small">${e.n}× · ${e.students} diák</td></tr>`).join('')}</table>`:'<p class="muted small">Még nincs adat a kikérdezésekből.</p>'}
   </div></div>
   <h3>Pecsétek diákonként</h3>
   ${S.length?`<div class="tw"><table><thead><tr><th>Diák</th>${isl.map(x=>`<th title="${esc(x.title)}">${code(x)}</th>`).join('')}<th>Összesen</th></tr></thead><tbody>
    ${S.map(s=>{const L=libOf(s);let n=0;return `<tr><td><b>${esc(s.nick)}</b></td>${isl.map(x=>{const r=L[x.id]||{};if(r.seal)n++;
      return `<td class="small" title="${r.tries?`${r.tries} próbálkozás, legjobb ${r.best}/6`:''}">${r.seal?`🏅 <span class="muted">${esc(String(r.seal).replace(/^\d{4}\.\s*/,''))}</span>`:r.tries?`${r.best}/6`:'–'}</td>`}).join('')}<td><b>${n}</b> / ${isl.length}</td></tr>`}).join('')}</tbody></table></div>
    <p class="small muted">🏅 = megvan A Könyvtáros pecsétje (dátummal). A szám a legjobb eredmény, ha még nincs pecsét. A végső, órai pecsét a következő frissítésben jön.</p>`:'<p class="muted">Még nincs diák.</p>'}
   <details class="box" style="margin-top:14px"><summary><b>A vizsga 45 fogalmának címe</b> (a diákok polcán ez látszik)</summary>
    <p class="small muted">Soronként egy cím, a vizsgalista sorrendjében. A 45. a JOKER. Az üres sor helyén „N. fogalom” áll.</p>
    <textarea id="libTitles" style="min-height:260px">${esc(libTitlesT().join('\n'))}</textarea>
    <p><button class="btn" id="btnLibTitles">Címek mentése</button></p></details>`;
}
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-concept],#btnLibTitles');if(!t)return;
  try{
    if(t.id==='btnLibTitles'){const lines=$('libTitles').value.split('\n').map(x=>x.trim()).slice(0,LIB_EXAM_N);
      await saveConfig({concept_titles:lines});render();toast('Címek mentve – a diákoknál a következő szinkronnál frissül');return}
    const [id,v]=t.dataset.concept.split(':');const cur={...libCfg()};
    if(id==='*')LIB_CONCEPTS.forEach(x=>cur[x.id]=v);else cur[id]=v;
    await saveConfig({concepts:cur});render();toast('Mentve – a diákoknál a következő szinkronnál frissül');
  }catch(x){toast('Hiba: '+x.message)}
});

/* ---------- v1.6 VISSZAJELZÉSEK: olvasott, értesítés + jutalom ---------- */
const FB_REWARD={bug:{gold:30,xp:20},idea:{gold:50,xp:30},like:{gold:0,xp:0}};
const fbUnread=()=>V.fbV16?(V.fb||[]).filter(f=>!f.read_at).length:0;
function fbExtraHTML(f){
  if(!V.fbV16)return '';
  const read=f.read_at?`<span class="small muted">✓ olvasva</span>`:`<button class="btn sm" data-fbread="${f.id}">✓ Olvasottnak jelölöm</button>`;
  let rw='';
  if(f.status==='done'&&f.kind!=='like'){
    if(f.notified_at)rw=`<div class="small" style="margin-top:6px">📬 Értesítve ${fmtDT(f.notified_at)}${f.reward_gold||f.reward_xp?` · +${f.reward_gold} arany, +${f.reward_xp} XP`:''}${f.note?` · „${esc(f.note)}”`:''} · ${f.student_seen_at?`<span class="pill g">a diák megkapta</span>`:'<span class="pill y">a diák még nem lépett be azóta</span>'}</div>`;
    else{const d=FB_REWARD[f.kind]||{gold:0,xp:0};
      rw=`<div class="fbrw" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)">
        <b class="small">${f.kind==='bug'?'Kijavítva':'Megvalósult'} – értesítés a diáknak:</b>
        <label class="small">arany <input type="number" min="0" id="fbg-${f.id}" value="${d.gold}" style="width:64px"></label>
        <label class="small">XP <input type="number" min="0" id="fbx-${f.id}" value="${d.xp}" style="width:64px"></label>
        <input type="text" id="fbn-${f.id}" placeholder="Üzenet (nem kötelező), pl. Köszi, a v1.6-ban benne van!" style="flex:1;min-width:180px">
        <button class="btn sm" data-fbnotify="${f.id}">📬 Értesítés + jutalom küldése</button></div>`}
  }
  return `<div style="margin-top:6px">${read}</div>${rw}`;
}
document.addEventListener('click',async e=>{
  const r=e.target.closest('[data-fbread],[data-fbnotify],#fbReadAll');if(!r)return;
  try{
    if(r.id==='fbReadAll'){const ids=(V.fb||[]).filter(f=>!f.read_at).map(f=>f.id);if(!ids.length)return;const now=new Date().toISOString();
      await api('feedback?id=in.('+ids.join(',')+')',{method:'PATCH',body:{read_at:now},prefer:'return=minimal'});V.fb.forEach(f=>{if(!f.read_at)f.read_at=now});render();return}
    if(r.dataset.fbread){const id=r.dataset.fbread,now=new Date().toISOString();await api('feedback?id=eq.'+id,{method:'PATCH',body:{read_at:now},prefer:'return=minimal'});
      const f=V.fb.find(x=>String(x.id)===id);if(f)f.read_at=now;render();return}
    if(r.dataset.fbnotify){const id=r.dataset.fbnotify,g=Math.max(0,parseInt($('fbg-'+id).value)||0),x=Math.max(0,parseInt($('fbx-'+id).value)||0),note=$('fbn-'+id).value.trim().slice(0,300),now=new Date().toISOString();
      r.disabled=true;await api('feedback?id=eq.'+id,{method:'PATCH',body:{reward_gold:g,reward_xp:x,note:note||null,notified_at:now,read_at:now},prefer:'return=minimal'});
      const f=V.fb.find(y=>String(y.id)===id);if(f)Object.assign(f,{reward_gold:g,reward_xp:x,note,notified_at:now,read_at:f.read_at||now});render();toast('Elküldve – a diák a következő belépéskor megkapja');return}
  }catch(x){toast('Hiba: '+x.message);r.disabled=false}
});
</script>
