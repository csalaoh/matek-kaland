<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matek 7 – kaland (kipróbálós verzió)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Orbitron:wght@500;800&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1c2a22; --bg2:#253629; --panel:#f3e9d2; --ink:#2b2218; --muted:#6b5b45;
  --accent:#b8862b; --accent2:#7a3e1d; --ok:#2f7d32; --bad:#b3362b; --line:#d8c7a3;
  --head:'Cinzel', Georgia, serif; --radius:14px; --glow:none;
}
body.scifi{
  --bg:#070b1a; --bg2:#0f1733; --panel:#111a36; --ink:#e6f1ff; --muted:#8fa3c7;
  --accent:#3fe0d0; --accent2:#8a6bff; --ok:#3ee07f; --bad:#ff5a7a; --line:#243259;
  --head:'Orbitron', 'Segoe UI', sans-serif; --radius:6px; --glow:0 0 18px rgba(63,224,208,.25);
}
*{box-sizing:border-box}
body{margin:0;font-family:'Nunito',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(1200px 600px at 20% -10%,var(--bg2),var(--bg));min-height:100vh;transition:background .4s}
body.scifi{background:
  radial-gradient(2px 2px at 10% 20%,#fff8,transparent),radial-gradient(1px 1px at 70% 30%,#fff9,transparent),
  radial-gradient(1px 1px at 40% 80%,#fff7,transparent),radial-gradient(2px 2px at 85% 65%,#fff6,transparent),
  radial-gradient(1200px 600px at 80% -10%,var(--bg2),var(--bg))}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 20px;color:#fff}
.emblem{width:46px;height:46px;flex:none}
.title{font-family:var(--head);font-size:1.35rem;letter-spacing:.03em}
.title small{display:block;font-family:'Nunito';font-size:.8rem;opacity:.75;letter-spacing:0}
.spacer{flex:1}
.res{display:flex;gap:10px}
.chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:6px 12px;font-weight:800;display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip svg{width:18px;height:18px}
.switch{display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}
.switch button{border:0;background:transparent;color:#fff;padding:6px 12px;border-radius:999px;cursor:pointer;font:inherit;font-weight:700}
.switch button.on{background:#fff;color:#111}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;padding:0 20px 24px;max-width:1180px;margin:0 auto}
@media (max-width:900px){main{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border-radius:var(--radius);padding:18px 20px;box-shadow:0 10px 30px rgba(0,0,0,.35),var(--glow);border:1px solid var(--line)}
body.fantasy .card{background-image:linear-gradient(180deg,#f7efdc,#efe2c4)}
.story{display:flex;gap:14px;align-items:flex-start}
.story .lvl{font-family:var(--head);font-size:1.1rem;color:var(--accent2)}
body.scifi .story .lvl{color:var(--accent)}
.story p{margin:.3rem 0 0;color:var(--muted)}
.track{display:flex;gap:8px;margin:14px 0 4px}
.step{flex:1;text-align:center;padding:8px 4px;border-radius:10px;border:2px solid var(--line);font-weight:800;font-size:.85rem;color:var(--muted);position:relative}
.step.done{border-color:var(--accent);color:var(--accent)}
.step.cur{background:var(--accent);border-color:var(--accent);color:#fff}
body.scifi .step.cur{color:#04121a}
.step .rw{display:block;font-weight:600;font-size:.72rem;opacity:.85}
.meters{display:flex;gap:22px;flex-wrap:wrap;margin:10px 0 0;font-size:.85rem;color:var(--muted)}
.dots{display:inline-flex;gap:5px;vertical-align:middle;margin-left:6px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.dot.g{background:var(--ok);border-color:var(--ok)}
.dot.r{background:var(--bad);border-color:var(--bad)}
.task{margin-top:16px}
.qlabel{font-size:.9rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.expr{font-size:1.75rem;margin:10px 0 6px;line-height:1.5;word-spacing:.08em}
@media (max-width:600px){.expr{font-size:1.3rem}}
.expr i{font-family:Georgia,'Times New Roman',serif;font-weight:600}
.subst{font-size:1.15rem;margin:4px 0 0}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.8em;line-height:1.05;margin:0 2px}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 2px}
.answer{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.answer input{flex:1;min-width:200px;font-size:1.35rem;padding:10px 14px;border-radius:10px;border:2px solid var(--line);background:rgba(255,255,255,.75);color:#111;font-family:Georgia,serif}
body.scifi .answer input{background:#0a1128;color:var(--ink);border-color:var(--line)}
.answer input:focus{outline:none;border-color:var(--accent)}
.btn{border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:800;cursor:pointer;background:var(--accent);color:#fff;font-size:1rem}
body.scifi .btn{color:#04121a}
body.scifi .btn.ghost{color:var(--accent)}
.btn.ghost{background:transparent;border:2px solid var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.kp{display:none;margin-top:12px;max-width:420px}
.kp.show{display:block}
.kp .row{display:grid;gap:6px;margin-bottom:6px}
.kp button{padding:12px 0;font-size:1.15rem;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.6);color:var(--ink);font-family:Georgia,serif;cursor:pointer}
body.scifi .kp button{background:#0a1128}
.kp button.l{font-style:italic;font-weight:700;color:var(--accent2)}
body.scifi .kp button.l{color:var(--accent)}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;display:none;line-height:1.45}
.fb.show{display:block}
.fb.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);border:1px solid var(--ok)}
.fb.bad{background:color-mix(in srgb,var(--bad) 13%,transparent);border:1px solid var(--bad)}
.fb.info{background:color-mix(in srgb,var(--accent) 14%,transparent);border:1px solid var(--accent)}
.fb b.big{font-family:var(--head);font-size:1.05rem}
.g0{color:#1f6fb2;font-weight:800}.g1{color:#b5361f;font-weight:800}.g2{color:#2f7d32;font-weight:800}.g3{color:#8a3ab9;font-weight:800}.g4{color:#a06a00;font-weight:800}
body.scifi .g0{color:#5fb8ff}body.scifi .g1{color:#ff7a5c}body.scifi .g2{color:#5ef08f}body.scifi .g3{color:#c69bff}body.scifi .g4{color:#ffd166}
.banner{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--accent2);color:#fff;font-weight:800;display:none}
.banner.show{display:block}
aside h3{font-family:var(--head);margin:0 0 6px;font-size:1rem}
aside .note{font-size:.8rem;color:var(--muted);margin:0 0 10px}
table{width:100%;border-collapse:collapse;font-size:.78rem}
th,td{text-align:left;padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:700}
td.okc{color:var(--ok);font-weight:800}td.badc{color:var(--bad);font-weight:800}
.rules{margin-top:16px;font-size:.82rem;color:var(--muted)}
.rules li{margin:3px 0}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tiny{font-size:.78rem;color:var(--muted)}
.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}

.tabs{display:flex;gap:6px;padding:0 20px 14px;max-width:1180px;margin:0 auto;flex-wrap:wrap}
.tabs button{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font:inherit;font-weight:800;padding:8px 16px;border-radius:999px;cursor:pointer}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
body.scifi .tabs button.on{color:#04121a}
aside{display:flex;flex-direction:column;gap:18px}
.charrow{display:flex;gap:12px;align-items:center}
.charrow svg{width:84px;height:96px;flex:none}
.stat{font-size:.85rem;color:var(--muted);margin:2px 0}
.stat b{color:var(--ink)}
.bar{height:10px;border-radius:6px;background:color-mix(in srgb,var(--muted) 25%,transparent);overflow:hidden;margin:4px 0 2px}
.bar>span{display:block;height:100%;background:var(--accent);transition:width .4s}
.bar.hp>span{background:var(--ok)}
.bar.hp.low>span{background:var(--bad)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:12px}
.pick{border:2px solid var(--line);border-radius:12px;padding:12px;text-align:center;cursor:pointer;background:rgba(255,255,255,.25);color:var(--ink);font:inherit}
body.scifi .pick{background:rgba(255,255,255,.03)}
.pick:hover:not(:disabled){border-color:var(--accent)}
.pick:disabled{opacity:.45;cursor:default}
.pick svg{width:90px;height:90px}
.pick h4{margin:6px 0 2px;font-family:var(--head);font-size:.95rem}
.pick .tiny{display:block}
.grade{display:inline-block;margin-top:6px;padding:2px 10px;border-radius:999px;background:var(--accent2);color:#fff;font-weight:800;font-size:.8rem}
.field{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:8px}
.fighter{text-align:center}
.fighter svg{width:130px;height:130px;max-width:100%}
@media (max-width:600px){.fighter svg{width:90px;height:90px}}
.fighter .name{font-family:var(--head);font-weight:800;font-size:.95rem}
.vs{font-family:var(--head);font-size:1.4rem;color:var(--accent2);font-weight:800}
body.scifi .vs{color:var(--accent)}
.attacks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
@media (max-width:600px){.attacks{grid-template-columns:1fr}}
.atk{border:0;border-radius:10px;padding:10px;font:inherit;cursor:pointer;background:var(--accent);color:#fff;text-align:left}
body.scifi .atk{color:#04121a}
.atk b{display:block;font-family:var(--head)}
.atk span{font-size:.8rem;opacity:.9}
.atk:disabled{opacity:.4;cursor:default}
.atk.t2{background:color-mix(in srgb,var(--accent) 70%,var(--accent2))}
.atk.t3{background:var(--accent2);color:#fff}
.subacts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.flash{animation:flash .5s}
@keyframes flash{0%{filter:none}30%{filter:brightness(2) saturate(0)}100%{filter:none}}
.dmgpop{font-weight:900;font-size:1.1rem;height:1.4rem}
.dmgpop.e{color:var(--bad)}.dmgpop.p{color:var(--bad)}
.shopitem{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
.shopitem .ic{width:44px;height:44px;flex:none}
.shopitem .grow{flex:1}
.shopitem h4{margin:0;font-family:var(--head);font-size:.95rem}
.badge{font-size:.72rem;padding:2px 8px;border-radius:999px;border:1px solid var(--accent);color:var(--accent);font-weight:800;margin-left:6px}
.hidden{display:none!important}
.introbox{color:var(--muted);margin:.3rem 0 0}

.story-l{font-family:var(--head);font-size:1.1rem;color:var(--accent2)}
body.scifi .story-l{color:var(--accent)}
.mapwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:12px;border-radius:16px}
.map{width:100%;min-width:640px;height:auto;display:block;border-radius:16px}
.node.open{cursor:pointer}.node.locked{cursor:not-allowed}
.node.open:hover>circle:not(.pulse){filter:brightness(1.08)}
.coupon .code{font-family:ui-monospace,Menlo,monospace;font-weight:900;font-size:1.25rem;letter-spacing:.15em;padding:8px 10px;border:2px dashed var(--accent);border-radius:8px;color:var(--accent2)}
body.scifi .coupon .code{color:var(--accent)}
.coupon.used{opacity:.55}
details.teacher{border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
details.teacher summary{cursor:pointer}
table.ped input{width:100%;font:inherit;font-size:.8rem;padding:4px;border:1px solid var(--line);border-radius:6px;background:rgba(255,255,255,.6);color:#111}
body.scifi table.ped input{background:#0a1128;color:var(--ink)}
.stage{position:relative;height:200px;border-radius:12px;overflow:hidden;margin:8px 0 10px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.stage svg.bg{position:absolute;inset:0;width:100%;height:100%}
.stage .hero{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:150px;height:195px}
.stage .hero svg{width:100%;height:100%}
.sbar{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;margin:4px 0}
.sbar b{font-size:.8rem}.sbar .bar{margin:0;height:9px}
.bar.hpc>span{background:#d64545}.bar.apc>span{background:#3b82f6}.bar.xpc>span{background:#f2a33a}.bar.gpc>span{background:#c9962e}
b.hpc{color:#d64545}b.apc{color:#3b82f6}b.xpc{color:#e08a1e}b.gpc{color:#b8862b}
body.scifi b.hpc{color:#ff6b6b}body.scifi b.apc{color:#6ea8ff}
.scene{border-radius:14px;overflow:hidden;line-height:0;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.scenesvg{width:100%;height:auto;display:block}
.apchip{font-family:Nunito,sans-serif;font-size:.8rem;background:#3b82f6;color:#fff;border-radius:999px;padding:2px 10px;margin-left:6px;vertical-align:middle}
.btn.apbtn{background:#3b82f6;color:#fff}
.shopitem.priv.locked{opacity:.8}
.field.arena{position:relative;border-radius:14px;overflow:hidden;padding:16px 10px;margin-top:10px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.field.arena>svg.bg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.field.arena>div{position:relative;z-index:1}
.field.arena .fighter{background:linear-gradient(to top,rgba(255,248,235,.88) 0,rgba(255,248,235,.88) 74px,transparent 74px);border-radius:12px;padding:6px 8px}
body.scifi .field.arena .fighter{background:linear-gradient(to top,rgba(10,17,40,.85) 0,rgba(10,17,40,.85) 74px,transparent 74px)}
.field.arena .fighter svg{filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
.field.arena .vs{color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.7)}
.ic{width:44px;height:44px;flex:none}
.evcard{display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:12px;margin:0 0 12px;background:linear-gradient(90deg,var(--accent2),color-mix(in srgb,var(--accent2) 60%,var(--accent)));color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.2)}
body.scifi .evcard{background:linear-gradient(90deg,#3b2f80,#1c4f6e)}
.evcard .evic{font-size:1.6rem}.evcard span{opacity:.92;font-size:.9rem}
.big.crit{color:#e8590c}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:50}
.ovcard{max-width:760px;margin:20px;padding:36px 40px;border-radius:24px;background:var(--panel);color:var(--ink);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.ovtxt{font-family:var(--head);font-size:2rem;line-height:1.3;margin:16px 0}
.clsbox{max-width:900px}
.clsgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:left}
@media (max-width:700px){.clsgrid{grid-template-columns:1fr}.clsbox{padding:18px 14px;max-height:88vh;overflow:auto}}
.clscard{border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.clscard.cur{border-color:var(--accent)}.clscard h4{margin:0;font-family:var(--head);text-align:center}
.clsav{height:190px;display:flex;justify-content:center;background:radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%);border-radius:12px}.clsav svg{height:190px;width:auto}
.clscard .btn{margin-top:auto}
.gsel{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin:0 0 12px}.gsel .btn{padding:6px 16px}
.fighter svg.av{height:175px;width:auto}
@media (max-width:600px){.fighter svg.av{height:120px}}
.rulesbox{margin-top:14px}.rulesbox summary{cursor:pointer;font-weight:800;color:var(--muted);font-size:.85rem}
.maphint{display:none}
@media (max-width:600px){
  header{padding:10px 12px;gap:8px}.emblem{width:34px;height:34px}.title{font-size:1.05rem}.title small{font-size:.7rem}
  .chip{padding:4px 10px;font-size:.85rem}.switch button{padding:4px 10px;font-size:.85rem}
  .notice{font-size:.72rem;padding:6px 10px;margin-bottom:8px;width:calc(100% - 20px)}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;margin:0;max-width:none;justify-content:space-around;gap:2px;flex-wrap:nowrap;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid rgba(255,255,255,.15);box-shadow:0 -6px 16px rgba(0,0,0,.35)}
  .tabs button{padding:8px 6px;font-size:.78rem;flex:1;border-radius:10px}
  body{padding-bottom:64px}
  main{padding:0 10px 16px;gap:12px}.card{padding:12px 12px}
  .evcard{padding:8px 10px;gap:8px;margin-bottom:8px}.evcard .evic{font-size:1.2rem}.evcard b{font-size:.9rem}.evcard span{font-size:.8rem}
  .introbox{font-size:.88rem}.track{margin:8px 0 2px}.step{padding:6px 2px;font-size:.78rem}
  .expr{margin:6px 0 4px}.flabel{margin-top:8px}.answer input{font-size:1.15rem;padding:8px 10px}
  .kp button{padding:10px 0}
  .maphint{display:block;font-size:.78rem;color:var(--muted);margin:6px 0 0}
}
.flabel{display:block;margin-top:12px;font-weight:800;font-size:.85rem;color:var(--muted)}
#form .answer{margin-top:10px}
button.step{font-family:inherit;cursor:pointer;background:transparent}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.45);opacity:0}}

.notice{max-width:1180px;margin:0 auto 12px;padding:8px 20px;color:#fff;opacity:.85;font-size:.85rem;background:rgba(255,255,255,.08);border-radius:10px;width:calc(100% - 40px)}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1c2a22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Matek-kaland">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>.installbtn{cursor:pointer;color:#fff;font:inherit;font-weight:800}
@media (display-mode: standalone){header{padding-top:calc(10px + env(safe-area-inset-top))}}</style>
</head>
<body class="fantasy">
<header>
  <svg class="emblem" id="emblem" viewBox="0 0 64 64"></svg>
  <div class="title"><span id="worldName"></span><small id="worldSub"></small></div>
  <div class="spacer"></div>
  <div class="res">
    <div class="chip" id="goldChip"><svg viewBox="0 0 20 20" id="goldIcon"></svg><span id="gold">0</span><span class="tiny" id="goldName" style="color:#fff;opacity:.7"></span></div>
  </div>
  <div class="switch" role="group" aria-label="Hangulat">
    <button id="tFantasy" class="on">Fantasy</button>
    <button id="tScifi">Sci-fi</button>
  </div>
</header>
<div class="notice">Kipróbálós verzió: jegyet nem ad, és senki nem látja, mit csinálsz benne. A haladásod ebben a böngészőben mentődik.</div>
<nav class="tabs" id="tabs">
  <button data-m="map">Térkép</button>
  <button data-m="practice">Gyakorlás</button>
  <button data-m="arena">Aréna</button>
  <button data-m="trial">Próba</button>
  <button data-m="shop">Bolt</button>
</nav>

<main>
  <section class="card">
    <div id="modeView"></div>

    <div class="task" id="taskArea">
      <div class="toprow">
        <div class="qlabel" id="qlabel"></div>
        <button class="btn ghost" id="kpToggle" style="padding:6px 10px;font-size:.85rem">⌨ Billentyűzet</button>
      </div>
      <div class="expr" id="expr"></div>
      <div class="subst" id="subst"></div>
      <form id="form" autocomplete="off">

<script>
/* ================= ENGINE (téma-független) ================= */
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t}return a||1}
class Q{
  constructor(n,d=1){if(d<0){n=-n;d=-d}const g=gcd(n,d);this.n=n/g;this.d=d/g}
  add(o){return new Q(this.n*o.d+o.n*this.d,this.d*o.d)}
  mul(o){return new Q(this.n*o.n,this.d*o.d)}
  neg(){return new Q(-this.n,this.d)}
  eq(o){return this.n===o.n&&this.d===o.d}
  get zero(){return this.n===0}
  static parseDec(s){ // "12.75" -> Q
    if(!/^\d*\.?\d*$/.test(s)||s===''||s==='.')return null;
    const [i,f='']=s.split('.');return new Q(parseInt((i||'0')+f,10),Math.pow(10,f.length));
  }
}
const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function combine(terms){ // [{c:Q,k:'ab'}] -> Map(k->Q), zeros removed, stable order
  const m=new Map();
  for(const t of terms){m.set(t.k,(m.get(t.k)||new Q(0)).add(t.c))}
  for(const [k,v] of [...m])if(v.zero)m.delete(k);
  return m;
}
const mapToTerms=m=>[...m].map(([k,c])=>({c,k})).sort((a,b)=>(a.k===''?1:0)-(b.k===''?1:0));

/* --- formázás --- */
function decStr(q){ // véges tizedes tört? -> "2,5", különben null
  let d=q.d,p=0;while(d%2===0){d/=2;p++}let r=0;while(d%5===0){d/=5;r++}
  if(d!==1)return null;const k=Math.max(p,r);if(k>3)return null;
  const v=Math.abs(q.n)/q.d;return v.toFixed(k).replace('.',',');
}
function absHTML(q,preferFrac){
  const a=new Q(Math.abs(q.n),q.d);
  if(a.d===1)return String(a.n);
  const ds=decStr(a);
  if(ds&&!preferFrac)return ds;
  return `<span class="frac"><span>${a.n}</span><span>${a.d}</span></span>`;
}
function numHTML(q,preferFrac){return (q.n<0?'−':'')+absHTML(q,preferFrac)}
function letters(k){return k.split('').map(ch=>`<i>${ch}</i>`).join('')}
function termHTML(t,first){
  const neg=t.c.n<0;const a=new Q(Math.abs(t.c.n),t.c.d);
  const coef=(t.k&&a.n===1&&a.d===1)?'':absHTML(a);
  const sign=first?(neg?'−':''):(neg?' − ':' + ');
  return sign+coef+letters(t.k);
}
function exprHTML(terms,groupOf){
  if(!terms.length)return '0';
  return terms.map((t,i)=>{const h=termHTML(t,i===0);
    if(!groupOf)return h;const g=groupOf(t.k);
    // a jelet ne színezzük, csak a tagot
    const m=h.match(/^(\s*[+−]?\s*)(.*)$/);return `${m[1]}<span class="g${g}">${m[2]}</span>`}).join('');
}

/* --- generátorok --- */
const VARSETS2=[['a','b'],['x','y'],['m','n'],['p','q']];
const VARSETS3=[['a','b','c'],['x','y','z'],['p','q','r']];
function mk(c,k){return {c:c instanceof Q?c:new Q(c),k}}

function genL1(){
  for(;;){
    const [u,v]=pick(VARSETS2);
    const keys=shuffle([u,u,v,'',pick([v,'',u])]).slice(0,rint(4,5));
    if(keys.filter(k=>k===u).length<2)continue;
    const terms=keys.map((k,i)=>mk((i>0&&Math.random()<.3?-1:1)*rint(1,9),k));
    const m=combine(terms);
    if(m.size<2||m.size===terms.length)continue;
    if([...m.values()].some(q=>q.n<0)&&Math.random()<.5)continue; // L1: többnyire pozitív eredmény
    return {level:1,vars:[u,v],terms,target:m};
  }
}
function genL2(){
  for(;;){
    const vs=pick(VARSETS3);const prod=[vs[0],vs[1]].sort().join('');
    const pool=shuffle([vs[0],vs[1],vs[2],prod,'']).slice(0,rint(3,4));
    let keys=[];pool.forEach(k=>{keys.push(k,k)});if(Math.random()<.5)keys.push(pick(pool));
    keys=shuffle(keys);
    const terms=keys.map((k,i)=>mk((Math.random()<.45?-1:1)*rint(1,12),k));
    if(Math.random()<.45){const t=pick(terms);t.c=t.c.add(new Q(t.c.n<0?-1:1,2))} // egy tizedes együttható
    if(Math.random()<.3){ // kieső tag
      const k=pick(pool);const idx=terms.map((t,i)=>t.k===k?i:-1).filter(i=>i>=0);
      if(idx.length===2){terms[idx[1]].c=terms[idx[0]].c.neg()}
    }
    const m=combine(terms);if(m.size<2)continue;
    return {level:2,vars:vs,terms,target:m};
  }
}
const VALS_INT=[-5,-4,-3,-2,-1,1,2,3,4,5].map(n=>new Q(n));
const VALS_DEC=[[1,2],[-1,2],[3,2],[-3,2],[5,2],[1,5],[-1,5],[3,10]].map(([n,d])=>new Q(n,d));
const VALS_FR=[[1,2],[-1,2],[1,3],[-1,3],[2,3],[1,4],[-1,4],[2,5]].map(([n,d])=>new Q(n,d));
function genL3(){
  for(;;){
    const [u,v]=pick(VARSETS2);const prod=[u,v].sort().join('');
    const withProd=Math.random()<.45;
    const pool=withProd?[u,v,prod]:[u,v,''];
    let keys=[];pool.forEach(k=>keys.push(k,k));keys=shuffle(keys).slice(0,rint(5,6));
    const terms=keys.map((k,i)=>mk((Math.random()<.4?-1:1)*rint(1,9),k));
    const m=combine(terms);if(m.size<2)continue;
    const mode=pick(['int','int','dec','frac']);
    const vu=pick(VALS_INT);
    const vv=mode==='int'?pick(VALS_INT):mode==='dec'?pick(VALS_DEC):pick(VALS_FR);
    const vals={[u]:vu,[v]:vv};
    const value=evalMap(m,vals);
    if(value.d>12||Math.abs(value.n/value.d)>200)continue;
    return {level:3,vars:[u,v],terms,target:m,vals,value,preferFrac:mode==='frac'};
  }
}
function evalMap(m,vals){let s=new Q(0);for(const [k,c] of m){let p=c;for(const ch of k)p=p.mul(vals[ch]);s=s.add(p)}return s}

/* --- válasz-értelmezés --- */
function norm(s){return s.replace(/[−–]/g,'-').replace(/[·*×\s]/g,'').replace(/,/g,'.').toLowerCase()}
function parseExpr(raw,allowed){ // -> {terms} vagy {err}
  const s=norm(raw);if(!s)return {err:'Üres a válasz.'};
  if(/[()]/.test(s))return {err:'Zárójel nélkül írd be.'};
  const parts=s.match(/[+-]?[^+-]+/g);
  if(!parts||parts.join('')!==s)return {err:'Ezt nem tudom értelmezni. Pl.: 5a − 3b + 2'};
  const terms=[];
  for(const p of parts){
    const m=p.match(/^([+-]?)(\d*\.?\d*)(?:\/(\d+))?([a-z]*)$/);
    if(!m)return {err:`Ezt a tagot nem értem: „${p}”.`};
    const [,sg,num,den,lt]=m;
    if(!num&&den)return {err:`Ezt a tagot nem értem: „${p}”.`};
    if(!num&&!lt)return {err:`Ezt a tagot nem értem: „${p}”.`};
    for(const ch of lt)if(!allowed.includes(ch))return {err:`A(z) „${ch}” betű nem szerepel a feladatban.`};
    const sorted=lt.split('').sort().join('');
    if(/(.)\1/.test(sorted))return {err:'Hatványt (pl. aa) most nem kérünk – nézd meg újra a tagokat.'};
    let c=num?Q.parseDec(num):new Q(1);if(!c)return {err:`Ezt a számot nem értem: „${num}”.`};
    if(den){if(+den===0)return {err:'Nullával nem osztunk.'};c=c.mul(new Q(1,+den))}
    if(sg==='-')c=c.neg();
    terms.push({c,k:sorted});
  }
  return {terms};
}
function parseNum(raw){
  const s=norm(raw);const m=s.match(/^([+-]?)(\d*\.?\d*)(?:\/(\d+))?$/);
  if(!m||!m[2])return null;let q=Q.parseDec(m[2]);if(!q)return null;
  if(m[3]){if(+m[3]===0)return null;q=q.mul(new Q(1,+m[3]))}
  return m[1]==='-'?q.neg():q;
}

/* --- ellenőrzés + hibatípus --- */
function checkSimplify(task,raw){
  const allowed=[...new Set(task.terms.map(t=>t.k).join(''))];
  const p=parseExpr(raw,allowed);if(p.err)return {status:'invalid',msg:p.err};
  const S=combine(p.terms),T=task.target;
  const same=S.size===T.size&&[...T].every(([k,c])=>S.has(k)&&S.get(k).eq(c));
  if(same){
    const keys=p.terms.map(t=>t.k);
    const dup=keys.length!==new Set(keys).size;const zero=p.terms.some(t=>t.c.zero);
    if(dup||zero)return {status:'unsimplified',msg:zero?'Jó az érték, de a 0-s tagot nem kell kiírni.':'Ugyanannyit ér, de még van összevonható tag.'};
    return {status:'correct'};
  }
  const extra=[...S.keys()].filter(k=>!T.has(k)),missing=[...T.keys()].filter(k=>!S.has(k));
  if(extra.length&&missing.length)return {status:'wrong',err:'Különnemű tagok összevonása',explain:'Csak az azonos betűrészű tagok vonhatók össze (pl. <i>a</i> és <i>ab</i> nem).'};
  if(missing.length){
    const merged=[...S].some(([k,c])=>T.has(k)&&missing.some(mk=>c.eq(T.get(k).add(T.get(mk)))));
    if(merged)return {status:'wrong',err:'Különnemű tagok összevonása',explain:'Csak az azonos betűrészű tagok vonhatók össze (pl. <i>a</i> és <i>ab</i>, vagy <i>a</i> és a szám tag nem).'};
    return {status:'wrong',err:'Kimaradt tag',explain:'Valamelyik tag kimaradt a végeredményből.'};
  }
  if(extra.length)return {status:'wrong',err:'Fölösleges tag',explain:'Olyan tag van a válaszban, ami az összevonás után kiesik (0 lesz) vagy nincs is a feladatban.'};
  const wrongKeys=[...T.keys()].filter(k=>!S.get(k).eq(T.get(k)));
  const nm=k=>k?`${'aeioufflmnrsxy'.includes(k[0])?'az':'a'} <i>${k}</i>-s tagoknál`:'a szám tagoknál';
  const list=ks=>ks.map(nm).join(' és ');
  const signKeys=wrongKeys.filter(k=>S.get(k).eq(T.get(k).neg()));
  if(signKeys.length)return {status:'wrong',err:'Előjelhiba',explain:`Az előjel csúszott el ${list(signKeys)}. Nézd meg újra, melyik tag előtt áll mínusz!`};
  if(wrongKeys.every(k=>k===''))return {status:'wrong',err:'Számolási hiba (szám tag)',explain:'A betű nélküli tagok összevonásánál csúszott el.'};
  return {status:'wrong',err:'Számolási hiba (együttható)',explain:`Az együttható nem stimmel ${list(wrongKeys)}. Add össze újra az előjeles együtthatókat!`};
}
function checkValue(task,raw){
  const q=parseNum(raw);
  if(!q){
    if(/[a-z]/i.test(raw))return {status:'invalid',msg:'Itt egy számot várok: a kifejezés értékét. Tört is jó, pl. 25/6.'};
    return {status:'invalid',msg:'Ezt a számot nem értem. Tizedesvessző és tört (pl. −7/2) is jó.'};
  }
  if(q.eq(task.value))return {status:'correct'};
  for(const ch of task.vars){const alt={...task.vals,[ch]:task.vals[ch].neg()};
    if(q.eq(evalMap(task.target,alt)))return {status:'wrong',err:'Előjelhiba behelyettesítéskor',explain:`Úgy számoltál, mintha <i>${ch}</i> ellentétes előjelű lenne. Negatív számot zárójelben helyettesíts be!`}}
  if(q.eq(task.value.neg()))return {status:'wrong',err:'Előjelhiba a végeredményben',explain:'Az érték nagysága jó, csak az előjele nem.'};
  const orig=task.terms.reduce((s,t)=>{let p=t.c;for(const ch of t.k)p=p.mul(task.vals[ch]);return s.add(p)},new Q(0));
  return {status:'wrong',err:'Számolási hiba',explain:'Először vond össze, és csak utána helyettesíts – úgy kevesebb a számolás.'};
}


function checkL3(task,rawE,rawV){
  // 1) összevont alak
  const se=checkSimplify(task,rawE);
  if(se.status==='invalid')return {status:'invalid',msg:'1. lépés: '+se.msg};
  if(se.status==='unsimplified')return {status:'unsimplified',msg:'1. lépés: '+se.msg};
  // 2) érték
  const q=parseNum(rawV);
  if(!q)return {status:'invalid',msg:/[a-z]/i.test(rawV)?'2. lépés: itt egy számot várok – a kifejezés értékét. Tört is jó, pl. 25/6.':'2. lépés: '+(rawV.trim()?'ezt a számot nem értem. Tizedesvessző és tört (pl. −7/2) is jó.':'írd be a helyettesítési értéket is!')};
  const eOk=se.status==='correct';
  const own=combine(parseExpr(rawE,[...new Set(task.terms.map(t=>t.k).join(''))]).terms);
  const vOwn=evalMap(own,task.vals);
  const vOk=q.eq(task.value)||q.eq(vOwn);           // továbbvitt hiba: a saját kifejezésébe jól helyettesített
  let vErr=null;
  if(!vOk){
    const m=eOk?task.target:own;
    vErr={err:'Számolási hiba',explain:'A behelyettesítés vagy a számolás nem stimmel.'};
    for(const ch of task.vars){const alt={...task.vals,[ch]:task.vals[ch].neg()};
      if(q.eq(evalMap(m,alt))){vErr={err:'Előjelhiba behelyettesítéskor',explain:`Úgy számoltál, mintha <i>${ch}</i> ellentétes előjelű lenne. Negatív számot zárójelben helyettesíts be!`};break}}
    if(vErr.err==='Számolási hiba'&&q.eq((eOk?task.value:vOwn).neg()))vErr={err:'Előjelhiba a végeredményben',explain:'Az érték nagysága jó, csak az előjele nem.'};
  }
  const status=eOk&&vOk?'correct':(eOk||vOk)?'partial':'wrong';
  const err=!eOk?se.err:vErr?vErr.err:'';
  return {status,eOk,vOk,eErr:eOk?null:se,vErr,follow:!eOk&&vOk,err};
}
function l3Report(r){
  const ok='✔',no='✘';
  const a=r.eOk?`${ok} <b>Összevonás:</b> jó.`:`${no} <b>Összevonás – ${r.eErr.err}.</b> ${r.eErr.explain}`;
  const b=r.vOk?`${ok} <b>Behelyettesítés és számolás:</b> jó${r.follow?' – a saját kifejezésedbe jól helyettesítettél, ezért ez a rész jár.':'.'}`
               :`${no} <b>Behelyettesítés – ${r.vErr.err}.</b> ${r.vErr.explain}`;
  return a+'<br>'+b;
}

const LIMIT_TXT={none:'',week:'hetente 1×',month:'havonta 1×'};
function weekKey(d=new Date()){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return t.getUTCFullYear()+'-W'+Math.ceil(((t-y)/86400000+1)/7)}
const monthKey=(d=new Date())=>d.getFullYear()+'-'+(d.getMonth()+1);
const usedInPeriod=p=>p.limit==='none'?0:S.coupons.filter(c=>c.pid===p.id&&(p.limit==='week'?c.week===weekKey():c.month===monthKey())).length;
const isoDay=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function regenAP(){ // tanítási naponként (H–P) +apDay(), legfeljebb apMax()
  const today=isoDay();if(!S.apDate){S.apDate=today;return}
  if(S.apDate>=today)return;
  const d=new Date(S.apDate+'T12:00:00');let gain=0;
  while(isoDay(d)<today){d.setDate(d.getDate()+1);const wd=d.getDay();if(wd>=1&&wd<=5)gain+=apDay()}
  S.ap=Math.min(apMax(),S.ap+gain);S.apDate=today;
}
function couponCode(){const a='ABCDEFGHJKLMNPRSTUVXYZ23456789';return Array.from({length:4},()=>a[Math.floor(Math.random()*a.length)]).join('')}

function practiceResult(t,r,entry){

    if(!t.hint)S.streak++;

      if(S.level<3){S.level++;if(S.level>S.max){S.max=S.level;banner(th.up(th.tiers[S.level-1]))}else banner(th.back(th.tiers[S.level-1]))}

    const g=Math.round(BASE[t.level]*f*goldMul()),x=Math.round(XPB[t.level]*f*xpMul(t.level));

  }else{

  if(t.hint>=2){

        const inner=gt.length>1?`(${e})`:e;return `<span class="g${g(k)}">${inner}</span>`});
      const joined=pieces.map((p,i)=>{if(i===0)return p;const neg=/^<span class="g\d">−/.test(p);return neg?' − '+p.replace(/^(<span class="g\d">)−/,'$1'):' + '+p}).join('');

    }else{

        else body=[absHTML(a),...vals].join('·');

        return (neg?' − ':' + ')+body}).join('');

    const hpFrac=S.hp!=null?S.hp/hpMax():1;S.cls=k;S.hp=Math.round(hpMax()*hpFrac);S.ap=Math.min(S.ap,apMax());

function shade(hex,p){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const t=p<0?0:255,a=Math.abs(p);
  r=Math.round((t-r)*a+r);g=Math.round((t-g)*a+g);b=Math.round((t-b)*a+b);return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}
